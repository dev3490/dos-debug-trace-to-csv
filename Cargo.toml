[package]
name = "dos-debug-trace-to-csv"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "dt2c"
path = "src/main.rs"

[dependencies]
winnow = "1.0.4"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
csv = "1.4.0"
